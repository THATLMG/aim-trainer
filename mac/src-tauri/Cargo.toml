[package]
name = "lmg-aim-trainer"
version = "1.5.0"
description = "LMG's Aim Trainer for Mac"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
