# Builds the Mac app (Apple Silicon + Intel) on GitHub's Mac machines and attaches the .dmg to the release.
name: Mac app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac/src-tauri

      - name: Which release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Tauri and make icons
        working-directory: mac
        run: |
          npm install
          npx tauri icon ../docs/rpc/logo.png
          # The app's version always matches the release it's attached to.
          sed -i '' 's/"version": "[0-9.]*"/"version": "${{ steps.tag.outputs.version }}"/' src-tauri/tauri.conf.json

      - name: Build
        working-directory: mac
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(find mac/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          cp "$DMG" LMGs-Aim-Trainer-mac.dmg
          ls -la LMGs-Aim-Trainer-mac.dmg
          gh release upload "${{ steps.tag.outputs.tag }}" LMGs-Aim-Trainer-mac.dmg --clobber --repo "$GITHUB_REPOSITORY"
